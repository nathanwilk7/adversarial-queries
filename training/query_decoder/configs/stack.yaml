# Stack (StackExchange) Query Reconstruction Config
# Fine-tune model to reconstruct SQL query strings from embeddings
# 10 tables: account, answer, badge, comment, post_link, question, site, so_user, tag, tag_question

output_dir: ./outputs/stack_qwen25_05B_4token_ffn_2epoch

# Tokenizer
tokenizer:
  _component_: torchtune.models.qwen2_5.qwen2_5_tokenizer
  path: ./saved_models/tt-models/Qwen/Qwen2.5-0.5B-Instruct/vocab.json
  merges_file: ./saved_models/tt-models/Qwen/Qwen2.5-0.5B-Instruct/merges.txt
  max_seq_len: 512  # Stack queries are short (similar to SQLStorm)

# Dataset
dataset:
  _component_: src.dataset.EmbeddingPromptDataset
  source: ./data/stack_embedded.parquet  # Generated by scripts/embed_queries.py
  max_seq_len: ${tokenizer.max_seq_len}
  input_embedding_dim: 256  # text-embedding-3-large @ 256 dims
  data_multiply: 2  # Multiply data to simulate epochs
  test_holdout: 200  # Hold out last 200 samples for testing

# Collate Function
collate_fn: src.dataset.embedding_aware_collate_for_transformer_decoder

# Training settings
seed: 42
shuffle: True
num_embedding_tokens: 4  # Number of soft prompt tokens

# Model
model:
  _component_: torchtune.models.qwen2_5.qwen2_5_0_5b

# Checkpointer
checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ./saved_models/tt-models/Qwen/Qwen2.5-0.5B-Instruct
  checkpoint_files: [model.safetensors]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN2
resume_from_checkpoint: False

# Training hyperparameters
batch_size: 64  # Can increase since Stack queries are shorter
epochs: 1  # data_multiply handles effective epochs
optimizer:
  _component_: torch.optim.AdamW
  fused: True
  lr: 1e-4
lr_scheduler:
  _component_: torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup
  num_warmup_steps: 50
loss:
  _component_: torch.nn.CrossEntropyLoss

max_steps_per_epoch: 10000000000
gradient_accumulation_steps: 1
clip_grad_norm: False
compile: False
optimizer_in_bwd: False

# Training environment
device: cuda

# Memory management
enable_activation_checkpointing: True
enable_activation_offloading: False

# Precision
dtype: bf16

# Logging
metric_logger:
  _component_: torchtune.training.metric_logging.WandBLogger
  project: advq-stack
log_every_n_steps: 1
log_peak_memory_stats: False

# Profiler (disabled)
profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: False
  output_dir: ${output_dir}/profiling_outputs
  cpu: True
  cuda: True
  profile_memory: False
  with_stack: False
  record_shapes: True
  with_flops: False
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
